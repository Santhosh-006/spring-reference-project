# Server Port
server.port=8080

# Database Configuration (MySQL)
# createDatabaseIfNotExist=true will automatically create the DB if it does not exist!
spring.datasource.url=jdbc:mysql://localhost:3306/wecare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# 'update' automatically creates or updates database tables matching your Java @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries in console so examiners can see Hibernate in action
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Show nice SQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
